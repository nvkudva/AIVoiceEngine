[project]
name = "aivoice-engine"
version = "0.1.0"
description = "Local voice engine: OpenAI Realtime-compatible speech API running on your own machine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "numpy>=1.26",
]

[project.optional-dependencies]
mac = [
    "mlx>=0.21",
    "mlx-lm>=0.20",
    "parakeet-mlx>=0.2",
    "mlx-audio>=0.2",
    "misaki[en]>=0.7",
]

[project.scripts]
aivoice = "aivoice.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
